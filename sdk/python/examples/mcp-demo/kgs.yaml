# Registry for the Claude <-> Samyama Graph MCP demo.
# One entry per knowledge graph. Consumed by serve_kg.py, register.py and demo.py.
#
# Fields:
#   key       short id (used on the serve_kg.py / register.py command line)
#   server    MCP server name registered with Claude Code (-> mcp__<server>__<tool>)
#   graph     tenant / graph name inside the running engine
#   repo      KG repo directory name under the workspace root ($SAMYAMA_WS)
#   tools:    where the MCP tools come from —
#               config  = load <repo>/mcp_server/config.yaml (curated tools)
#               auto    = SDK auto-generates tools from the live schema (ToolConfig())
#               code    = the repo ships a code-based FastMCP server (assetops)
#   title     human label shown in the demo output
#   question  the natural-language prompt sent to Claude
#   allow     MCP tool names Claude is allowed to call for this question

- key: legal
  server: samyama-legal
  graph: legal
  repo: legal-judgments-graph-kg
  tools: config
  title: Legal Judgments
  question: "Use the samyama-legal MCP: which judge decided the most cases?"
  allow: [top_judges]

