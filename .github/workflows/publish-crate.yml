name: Publish Crates to crates.io

# Publishes the six public crates when a GitHub Release is published.
#
# Why `published` and not `created`: `created` also fires for drafts, so a
# half-written release note could ship a version. `published` is the one
# explicit "this is a release" event.
#
# Normal pushes and merges never reach this workflow — ci.yml validates, this
# publishes. That separation is deliberate: not every commit is a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and validate every crate, upload nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Holds CARGO_REGISTRY_TOKEN. Keeping the publishing credential in its own
    # environment (rather than a plain repo secret) means it can carry
    # reviewer/branch protection independently of ordinary CI secrets.
    environment: crates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # crates.io rejects a re-publish of an existing version, so the tag and
      # the manifests must agree before anything is uploaded. sdk/python lives
      # outside the cargo workspace (see `exclude` in the root Cargo.toml) and
      # so cannot inherit the version — it is checked explicitly here rather
      # than trusted to stay in step.
      - name: Verify tag matches every manifest version
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --no-deps --format-version 1 > /tmp/meta.json

          # Select the root crate by name — cargo metadata does not promise an
          # order, so indexing into packages[] would be a silent trap.
          WS_VERSION=$(jq -r '.packages[] | select(.name == "samyama") | .version' /tmp/meta.json)
          if [ -z "$WS_VERSION" ]; then
            echo "::error::could not read the samyama version from cargo metadata"
            exit 1
          fi
          echo "workspace version: $WS_VERSION"

          # Every workspace crate inherits version.workspace, so a mismatch here
          # means someone hand-edited one back to a literal.
          MISMATCHED=$(jq -r --arg v "$WS_VERSION" \
            '.packages[] | select(.version != $v) | "  \(.name) is \(.version)"' /tmp/meta.json)
          if [ -n "$MISMATCHED" ]; then
            echo "::error::crates out of step with the workspace version $WS_VERSION"
            echo "$MISMATCHED"
            exit 1
          fi

          PY_CARGO=$(grep -m1 '^version = ' sdk/python/Cargo.toml | cut -d'"' -f2)
          PY_PROJ=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          for pair in "sdk/python/Cargo.toml:$PY_CARGO" "sdk/python/pyproject.toml:$PY_PROJ"; do
            file=${pair%%:*}; got=${pair##*:}
            if [ "$got" != "$WS_VERSION" ]; then
              echo "::error::$file is $got, workspace is $WS_VERSION"
              exit 1
            fi
          done

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            if [ "${TAG#v}" != "$WS_VERSION" ]; then
              echo "::error::release tag $TAG does not match version $WS_VERSION"
              exit 1
            fi
            echo "tag $TAG matches all manifests"
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -uo pipefail

          # Dependency order. Each crate must exist on the registry before
          # anything that depends on it can even be *packaged* — cargo resolves
          # the `version` of every path dependency against the real index, and
          # that includes optional ones. This is why the previous two-crate list
          # could never have worked: samyama-graph-algorithms carries an
          # optional dep on samyama-gpu, which had never been published.
          #
          #   samyama-gpu
          #     -> samyama-optimization        (independent, but cheap to do early)
          #     -> samyama-graph-algorithms    (optional dep on samyama-gpu)
          #       -> samyama                   (deps on algorithms + optimization + gpu)
          #         -> samyama-sdk             (dep on samyama)
          #           -> samyama-cli           (dep on samyama-sdk)
          CRATES=(
            samyama-gpu
            samyama-optimization
            samyama-graph-algorithms
            samyama
            samyama-sdk
            samyama-cli
          )

          # For the same reason, the dry run cannot be hoisted into a separate
          # up-front pass over all six: crate N's dry run only resolves once
          # crate N-1 is genuinely on the index. So each crate is validated
          # immediately before it is uploaded, and the chain advances one at a
          # time. cargo waits for each publish to appear on the index before
          # returning, so no manual sleep is needed between iterations.
          publish_crate() {
              local CRATE=$1
              echo "::group::$CRATE"

              local TMPLOG EXIT_CODE OUTPUT
              TMPLOG=$(mktemp)

              echo "--- dry run: $CRATE"
              cargo publish -p "$CRATE" --dry-run 2>&1 | tee "$TMPLOG"
              EXIT_CODE=${PIPESTATUS[0]}
              OUTPUT=$(cat "$TMPLOG")

              # A dry run of an already-published version fails on the duplicate,
              # which is a no-op for us rather than an error.
              if [ "$EXIT_CODE" -ne 0 ]; then
                  if echo "$OUTPUT" | grep -qE "already exists|already uploaded|is already published"; then
                      echo "already on crates.io — skipping"
                      rm -f "$TMPLOG"; echo "::endgroup::"; return 0
                  fi
                  echo "::error::dry run failed for $CRATE (exit $EXIT_CODE)"
                  rm -f "$TMPLOG"; echo "::endgroup::"; return "$EXIT_CODE"
              fi

              if [ "$DRY_RUN" = "true" ]; then
                  echo "DRY_RUN set — validated, not uploading"
                  rm -f "$TMPLOG"; echo "::endgroup::"; return 0
              fi

              echo "--- publish: $CRATE"
              cargo publish -p "$CRATE" 2>&1 | tee "$TMPLOG"
              EXIT_CODE=${PIPESTATUS[0]}
              OUTPUT=$(cat "$TMPLOG")
              rm -f "$TMPLOG"

              if [ "$EXIT_CODE" -eq 0 ]; then
                  echo "published $CRATE"
              elif echo "$OUTPUT" | grep -qE "already exists|already uploaded|is already published"; then
                  echo "already on crates.io — skipping"
              else
                  echo "::error::failed to publish $CRATE (exit $EXIT_CODE)"
                  echo "::endgroup::"; return "$EXIT_CODE"
              fi

              echo "::endgroup::"
          }

          for crate in "${CRATES[@]}"; do
            publish_crate "$crate" || exit $?
          done

          echo "all crates processed (DRY_RUN=$DRY_RUN)"
